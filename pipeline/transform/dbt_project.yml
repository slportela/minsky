name: minsky
version: "0.1.0"
profile: minsky

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Local mirror of s3://<bucket>/bronze (see `make mirror`), relative to this folder.
  bronze_root: "../../data/bronze"
  # Where silver Parquet is exported (published to S3 with `make publish`).
  lake_root: "../../data/lake"
  # The simulated "today" for gold (policy windows, complaint recency). Must equal MINSKY_TODAY,
  # the backend's fixed date (backend/src/minsky_api/config.py); the dispute_scenarios model checks it.
  as_of_date: "2026-06-18"

models:
  minsky:
    silver:
      +materialized: table
      +tags: ["silver"]
      +contract:
        enforced: true
    gold:
      # Read models of the simulated bank, loaded into Postgres as bank.* (pipeline/load_gold.py).
      +materialized: table
      +schema: bank
      +tags: ["gold"]

seeds:
  minsky:
    enum_mappings:
      +tags: ["silver"]  # not ref'd by the models (the generator inlines it), so tag it to rebuild with silver
      +column_types:
        table_name: varchar
        column_name: varchar
        raw_value: varchar
        canonical_value: varchar
