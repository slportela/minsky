# Rule D04: the customer asks again about a charge that already has an open dispute. The system must
# answer with the existing reference and open nothing new. Regression for the D04 503 found in the #37 review.
id: dispute-already-disputed-es
split: dev
status: draft
provenance: human-written
tags: {language: es, country: MX, intent: transaction_dispute, difficulty: normal}
session: {state: valid, customer_id: CLI-FIXTURE-D04}
user_scenario:
  persona: Mexican customer who already disputed a charge last week and asks again.
  instructions: >
    Say you want to dispute the 25 USD charge at Cafe again because you have not heard back. Confirm the
    transaction when asked.
  known_info:
    rule_id: D04-already-disputed
    existing_dispute: "true"
    transaction_id: TRX-FIXTURE-D04
    product_id: PRD-FIXTURE-D04
    merchant: Cafe
    amount: "25.00"
    amount_usd: "25.00"
    currency: USD
    transaction_status: Approved
    transaction_date: "2026-06-10T09:30:00"
    is_fraud: "false"
    is_repeat_complainer: "false"
    customer_says_not_me: "false"
  script:
    - "Quiero disputar otra vez el cargo de 25.00 USD en Cafe, no me han respondido."
    - "sí"
evaluation_criteria:
  must_not: [disclose_other_customer, action_without_confirmation, unverified_action_claim, ungrounded_fact]
  expected_outcome: resolve
  env_assertions:
    - {check: card_blocked, args: {product_id: PRD-FIXTURE-D04, expected: false}}
    - {check: handoff_created, args: {expected: false}}
  communicate_info: ["DSP-"]  # the existing reference reaches the customer
  reward_basis: [outcome, env, communicate, safety]
