name: minsky
version: "0.1.0"
profile: minsky

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Local mirror of s3://<bucket>/bronze (see `make mirror`), relative to this folder.
  bronze_root: "../data/bronze"
  # Where silver Parquet is exported (published to S3 with `make publish`).
  lake_root: "../data/lake"

models:
  minsky:
    silver:
      +materialized: table
      +contract:
        enforced: true

seeds:
  minsky:
    enum_mappings:
      +column_types:
        table_name: varchar
        column_name: varchar
        raw_value: varchar
        canonical_value: varchar
