<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@include base.css*/
        /*@include phone.css*/
        #s1 .ph { left: 755px; top: 70px; filter: saturate(0.25); }
        #s1 .call { position: absolute; inset: 0; background: linear-gradient(180deg, #1c232b, #0b0f14); }
        #s1 .call .who { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 600; }
        #s1 .call .dept { position: absolute; top: 168px; left: 0; right: 0; text-align: center; font-size: 18px; color: #93a3b1; }
        #s1 .st { position: absolute; top: 214px; left: 0; right: 0; text-align: center; font-size: 22px; color: #c4ced6; }
        #s1 .wave { position: absolute; top: 300px; left: 60px; right: 60px; height: 90px; display: flex; gap: 8px; align-items: center; justify-content: center; }
        #s1 .wave b { display: block; width: 10px; height: 60px; border-radius: 5px; background: #6f7f8d; }
        #s1 .keys { position: absolute; bottom: 70px; left: 0; right: 0; display: flex; justify-content: center; gap: 34px; }
        #s1 .keys b { display: block; width: 74px; height: 74px; border-radius: 50%; background: #2a3440; }
        #s1 .keys b.end { background: #c0392b; }
        #s1 .later { position: absolute; left: 22px; right: 22px; top: 430px; padding: 18px 20px; border-radius: 20px; background: #20272f; font-size: 22px; text-align: center; color: #e3e9ee; }
        #s1 .stats { position: absolute; left: 1010px; top: 190px; width: 800px; }
        #s1 .stat { display: flex; align-items: baseline; gap: 30px; padding: 26px 0; border-bottom: 1px solid #1d2a35; }
        #s1 .stat .n { width: 300px; flex: none; font-size: 120px; font-weight: 750; letter-spacing: -0.045em; line-height: 1; color: #ff6b6b; }
        #s1 .stat .l { font-size: 34px; line-height: 1.25; color: #d4dde4; }
        #s1 .big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #s1 .big .n { font-size: 260px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
        #s1 .big .l { font-size: 46px; color: #93a3b1; margin-top: 20px; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
        <div id="s1" class="scene">
          <div id="s1-stage" class="layer">
            <div id="s1-phone" class="ph">
              <div class="ph-screen">
                <div class="call">
                  <div class="ph-island"></div>
                  <div class="who">LATAM Bank</div>
                  <div class="dept">Customer service</div>
                  <div id="s1-st1" class="st">calling…</div>
                  <div id="s1-st2" class="st">On hold · <span id="s1-hold" class="mono">00:00</span></div>
                  <div id="s1-st3" class="st">In call · <span id="s1-call" class="mono">00:00</span></div>
                  <div id="s1-st4" class="st">Call ended</div>
                  <div id="s1-wave" class="wave"></div>
                  <div id="s1-later" class="later">“We'll get back to you.”</div>
                  <div class="keys"><b></b><b></b><b class="end"></b></div>
                </div>
              </div>
            </div>
            <div class="stats">
              <div id="s1-a" class="stat"><span class="n" id="s1-an">0%</span><span class="l">of complaint calls end without a solution</span></div>
              <div id="s1-b" class="stat"><span class="n" id="s1-bn">0%</span><span class="l">of all complaints are disputed charges</span></div>
              <div id="s1-c" class="stat"><span class="n" id="s1-cn">0</span><span class="l">days to resolve a dispute (median)</span></div>
            </div>
          </div>
          <div id="s1-big" class="big">
            <div id="s1-bign" class="n">0</div>
            <div id="s1-bigl" class="l">disputes in three years. One bank.</div>
          </div>
          <div id="s1-foot" class="foot">LATAM Bank dataset (synthetic): complaints and call-center tables, June 2023 to June 2026.</div>
          <div class="vig"></div>
        </div>
      </div>
      <script>
        //@include chat.js
        const tl = gsap.timeline({ paused: true });
        const mmss = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
        // hold-music bars: deterministic heights driven by one proxy
        const wave = document.getElementById("s1-wave");
        const bars = [];
        for (let i = 0; i < 14; i++) { const b = document.createElement("b"); wave.appendChild(b); bars.push(b); }
        const w = { t: 0 };
        const drawWave = () => bars.forEach((b, i) => { b.style.transform = "scaleY(" + (0.25 + 0.75 * Math.abs(Math.sin(w.t * 6 + i * 0.7) * Math.cos(w.t * 2.3 + i * 0.3))) + ")"; });
        drawWave();
        tl.fromTo("#s1-st1", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 2.4);
        tl.fromTo("#s1-st2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.5);
        tl.fromTo("#s1-wave", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.5);
        tl.to(w, { t: 4, duration: 4, ease: "none", onUpdate: drawWave }, 2.5);
        hfCount(tl, document.getElementById("s1-hold"), 120, 2.5, 1.6, mmss);
        tl.to("#s1-st2", { opacity: 0, duration: 0.2 }, 4.2);
        tl.to("#s1-wave", { opacity: 0, duration: 0.3 }, 4.2);
        tl.fromTo("#s1-st3", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.3);
        hfCount(tl, document.getElementById("s1-call"), 432, 4.3, 1.8, mmss);
        tl.to("#s1-st3", { opacity: 0, duration: 0.2 }, 6.3);
        tl.fromTo("#s1-st4", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.4);
        tl.fromTo("#s1-later", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.6);
        // phone steps aside, stats arrive as the voice names them
        tl.to("#s1-phone", { x: -470, duration: 1, ease: "power3.inOut" }, 7.6);
        tl.fromTo("#s1-a", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 8.0);
        hfCount(tl, document.getElementById("s1-an"), 56, 8.0, 0.9, (v) => Math.round(v) + "%");
        tl.fromTo("#s1-foot", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 8.2);
        tl.fromTo("#s1-b", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 10.2);
        hfCount(tl, document.getElementById("s1-bn"), 40, 10.2, 0.9, (v) => Math.round(v) + "%");
        tl.fromTo("#s1-c", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 13.0);
        hfCount(tl, document.getElementById("s1-cn"), 15, 13.0, 0.9, (v) => Math.round(v) + (v >= 14.99 ? "+" : ""));
        // the scale: one number
        tl.to("#s1-stage", { opacity: 0, scale: 0.96, duration: 0.7, ease: "power2.in" }, 16.0);
        tl.fromTo("#s1-big", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 16.6);
        hfCount(tl, document.getElementById("s1-bign"), 27133, 16.6, 1.8, (v) => Math.round(v).toLocaleString("en-US"));
        tl.fromTo("#s1-bigl", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6 }, 17.8);
        tl.to(["#s1-big", "#s1-foot"], { opacity: 0, duration: 0.7 }, 21.6);
        window.__timelines["s1"] = tl;
      </script>
    </template>
  </body>
</html>
