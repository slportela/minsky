        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s0-phone", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0.3);
        // the buzz
        tl.fromTo("#s0-notif", { opacity: 0, y: -40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.4);
        tl.fromTo("#s0-phone", { x: 0 }, { x: 5, duration: 0.05, repeat: 7, yoyo: true, ease: "none", immediateRender: false }, 1.4);

        tl.fromTo("#s0-foot", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.6);
        tl.fromTo("#s0-when", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.8);
        tl.fromTo("#s0-where", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.6);
        tl.fromTo("#s0-r1", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 5.6);
        tl.fromTo("#s0-r2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 7.6);
        tl.fromTo("#s0-amt", { color: "#e3e9ee" }, { color: "#ff6b6b", duration: 0.4 }, 7.7);
        tl.to(["#s0 .left", "#s0 .right", "#s0-foot"], { opacity: 0, duration: 0.5 }, 10.9);
        window.__timelines["s0"] = tl;
