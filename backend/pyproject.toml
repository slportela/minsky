[project]
name = "minsky-api"
version = "0.1.0"
description = "Dispute-intake backend: orchestrator, policy, tools, identity"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "openai>=2.0",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.4"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
