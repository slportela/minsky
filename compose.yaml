# Development and POC only: the whole system on one machine, a laptop (make up) or the demo EC2 host.
# This is NOT the production architecture: production runs the same images on ECS with Aurora
# (docs/architecture.md); docs/poc_to_prod.md maps every service below to its production counterpart.
name: minsky

# Langfuse (tracing, eval runs, scores): add the official self-hosting compose file as
# infra/langfuse/compose.yaml (pinned version) and uncomment:
# include:
#   - infra/langfuse/compose.yaml

services:
  caddy:  # TLS and routing: /api/* -> api, everything else -> web
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, web]
    restart: unless-stopped

  web:
    build: ./frontend
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      MINSKY_ENVIRONMENT: ${MINSKY_ENVIRONMENT:-local}
      MINSKY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-minsky}:${POSTGRES_PASSWORD:-minsky}@postgres:5432/${POSTGRES_DB:-minsky}
      MINSKY_AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_REGION: ${AWS_REGION:-us-east-1}  # Bedrock and S3: instance role on EC2, ~/.aws locally
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  postgres:  # bank.* read models (gold, loaded from the lake) + cases.* writes
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minsky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minsky}
      POSTGRES_DB: ${POSTGRES_DB:-minsky}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
